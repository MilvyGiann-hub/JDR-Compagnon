<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compagnon">
<meta name="theme-color" content="#2C5A88">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif;background:#ECEEF2}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Compagnon d'aventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout : appli plein écran, zone défilante + barre d'onglets en bas ; cartes réservées aux PV et caractéristiques */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --sunk:#E1E5EC; --ink:#18202E; --muted:#596377; --line:#D2D8E1;
  --accent:#2C5A88; --accent-ink:#FFFFFF; --accent-soft:#DCE6F1;
  --gold:#946A10; --good:#2A7A4F; --bad:#B03A2E;
  --f-display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --f-body:"Alegreya Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --surface:#171D28; --sunk:#0B0E14; --ink:#E4E8EF; --muted:#8C96A8; --line:#283143;
  --accent:#7EA6D4; --accent-ink:#0F131B; --accent-soft:#1E2B3D;
  --gold:#D8AE55; --good:#5DBB85; --bad:#E2766B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#171D28; --sunk:#0B0E14; --ink:#E4E8EF; --muted:#8C96A8; --line:#283143;
  --accent:#7EA6D4; --accent-ink:#0F131B; --accent-soft:#1E2B3D;
  --gold:#D8AE55; --good:#5DBB85; --bad:#E2766B; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;font-variant-numeric:lining-nums tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}

/* barre du haut */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.who{min-width:0}
.who b{display:block;font-family:var(--f-display);font-size:1.15rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:.82rem;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:0;background:transparent;padding:5px 9px;border-radius:6px;font-size:.8rem;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.on.adv{color:var(--good)} .seg button.on.dis{color:var(--bad)}

main{flex:1;overflow-y:auto;padding:14px 16px 96px;display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.04em;margin:0 0 8px;color:var(--muted);text-wrap:balance}
.note{font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin:0}

/* PV */
.vitals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hpRow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hpNum{font-family:var(--f-display);font-size:2.6rem;line-height:1;font-weight:700}
.hpNum small{font-size:1.1rem;color:var(--muted);font-weight:500}
.hpLbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);margin:10px 0 12px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--good);transition:width .25s}
.bar i.t{background:var(--accent)}
.bar.low i:first-child{background:var(--bad)}
.hpCtl{display:grid;grid-template-columns:1fr 84px 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad)} .btn.good{color:var(--good)}
.btn.small{padding:6px 10px;font-size:.88rem}
.num{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 8px;text-align:center}
.temp{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.88rem;color:var(--muted)}
.temp input{width:64px;padding:5px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
.stat span{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button.stat{background:var(--surface)}
.stat.insp.on{border-color:var(--gold);color:var(--gold)}

/* caractéristiques */
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.ab span{font-size:.72rem;letter-spacing:.1em;color:var(--muted);font-weight:700}
.ab b{font-family:var(--f-display);font-size:1.9rem;line-height:1}
.ab em{font-style:normal;font-size:.8rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:0 8px}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex-shrink:0}
.row .dot.on{background:var(--accent);border-color:var(--accent)}
.row .nm{flex:1;min-width:0}
.row .ab3{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.row .md{font-weight:700;min-width:2.4em;text-align:right}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.88rem}
.chip.on{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.stepper{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.92rem}
.stepper b{min-width:1.5em;text-align:center}
.death{display:flex;gap:18px;flex-wrap:wrap}
.death div{display:flex;align-items:center;gap:6px;font-size:.9rem}
.pip{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);padding:0}
.pip.s.on{background:var(--good);border-color:var(--good)}
.pip.f.on{background:var(--bad);border-color:var(--bad)}
.rest{display:grid;grid-template-columns:1fr 1fr;gap:8px}

details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
summary{padding:12px 14px;font-weight:500;cursor:pointer}
.form{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);min-width:0}
.form label.w{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:7px 8px;font-size:.95rem;color:var(--ink);width:100%}
.form .grid6{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.checks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem}
.checks label{flex-direction:row;align-items:center;gap:5px;font-size:.88rem;color:var(--ink)}
.checks input{width:auto}

/* dés */
.hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.dieBtn{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.shape{width:100%;aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:1.15rem;transition:transform .12s}
.dieBtn:active .shape{transform:scale(.92)}
.dieBtn.big .shape{font-size:1.8rem}
.d4{clip-path:polygon(50% 3%,97% 94%,3% 94%);padding-top:28%}
.d6{border-radius:14%}
.d8{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.d10{clip-path:polygon(50% 0,100% 42%,50% 100%,0 42%);padding-bottom:8%}
.d12{clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%);padding-top:10%}
.d20{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.d100{border-radius:50%;font-size:1rem}
.dice{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;padding:0 6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.92rem}
.opt .stp{display:flex;align-items:center;gap:6px}
.opt .stp b{min-width:2.2em;text-align:center}
.sq{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;padding:0}
.log{display:flex;flex-direction:column}
.log div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.log div span:first-child{min-width:0}
.log small{color:var(--muted);display:block}
.log b{font-family:var(--f-display);font-size:1.25rem}
.log b.crit{color:var(--gold)} .log b.fail{color:var(--bad)}
.empty{color:var(--muted);font-size:.9rem;padding:10px 0}

/* attaques */
.castLine{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted);margin:-2px 0 10px}
.castLine b{color:var(--ink)}
.atks{display:flex;flex-direction:column;gap:10px}
.atk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.atkHead{display:flex;width:100%;align-items:flex-start;gap:10px;border:0;background:transparent;padding:12px 14px 8px;text-align:left}
.atkHead .nm{flex:1;min-width:0}
.atkHead b{font-size:1.03rem}
.atkHead small{display:block;color:var(--muted);font-size:.82rem}
.chev{color:var(--muted);font-size:.8rem;padding-top:3px}
.kind{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.tag{display:inline-block;font-size:.74rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:3px 4px 0 0;color:var(--muted)}
.tag.on{border-color:var(--gold);color:var(--gold)}
.atkOpts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 14px 10px;font-size:.85rem}
.atkOpts select{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:4px 6px;font-size:.85rem}
.atkOpts .seg button{font-size:.78rem}
.atkBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px}
.atkBtns .btn{display:flex;flex-direction:column;align-items:center;padding:7px 6px;font-size:.78rem;line-height:1.2}
.atkBtns .btn b{font-family:var(--f-display);font-size:1.15rem}
.btn.crit{border-color:var(--gold);color:var(--gold);background:var(--accent-soft)}
.critT{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--muted)}
.critT.on{border-style:solid;border-color:var(--gold);color:var(--gold)}
.atkInfo{border-top:1px solid var(--line);padding:10px 14px 12px;font-size:.88rem}
.atkInfo dl{margin:0}
.atkInfo dt{font-weight:700;margin-top:6px}
.atkInfo dd{margin:2px 0 0;color:var(--muted)}
.atkInfo details{margin-top:12px;background:var(--bg)}
.addRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

.atkTop{display:flex;align-items:flex-start;gap:0;padding-left:0}
.atkTop .prep{margin:14px 0 0 14px}
.atk.off .atkHead b{color:var(--muted)}
.inlineSel{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:1px 4px}
.atkInfo dd.desc{color:var(--ink);line-height:1.5}
.form textarea,.bioTa,.bioTa{background:var(--surface)}
.bioTop{padding:0}

.flat{padding:0}
.hint{font-size:.84rem;color:var(--muted);margin:8px 0 0}
.addBg{display:grid;grid-template-columns:1fr auto;gap:8px}
.addBg input{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:7px 8px;min-width:0}
.chars{display:flex;flex-direction:column;gap:6px}
.charRow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.charRow.on{border-color:var(--accent)}
.charRow .nm{flex:1;min-width:0}
.charRow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.charRow small{color:var(--muted);font-size:.82rem}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex-shrink:0}
.charRow.on .av{background:var(--accent);color:var(--accent-ink)}
.cur{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.syncStat{font-size:.88rem;margin:0 0 4px;padding:9px 11px;border-radius:8px;background:var(--sunk);color:var(--muted)}
.syncStat.ok{color:var(--good)} .syncStat.error{color:var(--bad)}
.impBtn{text-align:center;cursor:pointer}
.expBox{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.expBox textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem;color:var(--ink)}
.whoBtn{border:0;background:transparent;padding:0;text-align:left;max-width:100%;min-width:0;display:block}

.picker,.lvlup,.gen{grid-column:1/-1;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.gen{background:var(--bg)}
.pickHead{display:flex;justify-content:space-between;align-items:center}
.pickHead b{font-family:var(--f-display);font-size:1.05rem}
.picker input[type=search],.luIn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;width:100%;color:var(--ink)}
.pickFilt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pickFilt select,.luRow select,.genCell select,.luBlock select{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px;min-width:0;color:var(--ink)}
.pickList{max-height:55vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.pickRow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pickRow .nm{flex:1;min-width:0}
.pickRow small{display:block;color:var(--muted);font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
.tag.mod{border-color:var(--accent);color:var(--accent);margin-left:6px}
.luBlock{display:flex;flex-direction:column}
.luRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.luList{margin:0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.luChk{display:inline-flex;gap:6px;align-items:center}
.feats{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:10px}
.tagX{border:0;background:transparent;color:inherit;padding:0 0 0 6px;font-size:.9rem}
.genGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.genCell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.genCell .stp{display:flex;align-items:center;gap:4px}
.genCell .stp b{color:var(--ink);font-size:1rem;min-width:1.4em;text-align:center}
.genCell .sq{width:28px;height:28px}
.genRes{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.genRes div{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 0}
.genRes span{font-size:.65rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.genRes b{font-family:var(--f-display);font-size:1.2rem;line-height:1.1}
.genRes em{font-style:normal;font-size:.75rem;color:var(--muted)}
.warn{color:var(--bad);font-size:.85rem;margin:0}

/* sorts */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px}
.slot span{width:3.4em;font-size:.82rem;color:var(--muted)}
.slot .pips{display:flex;gap:6px;flex-wrap:wrap}
.gem{width:24px;height:24px;transform:rotate(45deg);border:1.5px solid var(--accent);background:var(--accent);border-radius:4px;padding:0}
.gem.used{background:transparent;border-color:var(--line)}
.spell{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.spell .nm{flex:1;min-width:0}
.spell .nm b{font-weight:500;display:block}
.spell .nm small{color:var(--muted);font-size:.82rem}
.spell.off .nm b{color:var(--muted)}
.prep{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line);background:transparent;padding:0;flex-shrink:0;color:var(--accent-ink);font-size:.8rem}
.prep.on{background:var(--accent);border-color:var(--accent)}
.x{border:0;background:transparent;color:var(--muted);font-size:1.2rem;padding:4px 6px}
.lvlHead{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:12px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.add{display:grid;grid-template-columns:1fr 70px auto;gap:8px;margin-top:12px}
.add input,.add select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-width:0}

/* sac */
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.coin{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.coin input{width:100%;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;font-size:1rem;font-weight:500;color:var(--ink)}
.coin.po input{border-color:var(--gold)}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.item .nm{flex:1;min-width:0}
.item .nm small{display:block;color:var(--muted);font-size:.82rem}
.item .stp{display:flex;align-items:center;gap:4px}
.item .stp b{min-width:1.8em;text-align:center}
.item .sq{width:30px;height:30px}

/* onglets */
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
nav.tabs button{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;color:var(--muted)}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}

/* résultat de jet */
.toast{position:absolute;left:16px;right:16px;bottom:74px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);transform:translateY(10px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast .tot{font-family:var(--f-display);font-size:2.3rem;font-weight:700;line-height:1;min-width:1.6em;text-align:center}
.toast.crit .tot{color:var(--gold)} .toast.fail .tot{color:var(--bad)}
.toast .txt{min-width:0}
.toast .txt b{display:block}
.toast .txt small{opacity:.75}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="who" id="who"></div>
    <div class="seg" id="mode" aria-label="Mode des jets de d20"></div>

function migrate(c){

  const h=hashOf(S);

const SYNC={state:"local",col:null,first:true,pending:new Set(),timer:null,at:0,deferred:false};
function syncText(){
  const t=SYNC.at?new Date(SYNC.at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";
  return {local:"Enregistré sur cet appareil uniquement. La synchronisation s'active quand l'appli est ouverte connectée à ton compte Claude.",
    sync:"Connexion à ton compte…",
    ok:`Synchronisé avec ton compte Claude${t?" à "+t:""}. Tes personnages te suivent sur tous tes appareils.`,
    error:"Synchronisation interrompue. Tes modifications restent enregistrées sur cet appareil."}[SYNC.state];
}
function setSync(st){SYNC.state=st;if(st==="ok")SYNC.at=Date.now();const el=document.getElementById("syncStat");if(el){el.textContent=syncText();el.className="syncStat "+st}}
function queuePush(id){SYNC.pending.add(id);clearTimeout(SYNC.timer);SYNC.timer=setTimeout(flush,1200)}
async function flush(){
  if(!SYNC.col||SYNC.first)return;
  const ids=[...SYNC.pending];SYNC.pending.clear();
  for(const id of ids){
    try{
      const c=APP.chars[id];
      if(c)await SYNC.col.doc(id).set({updatedAt:c.updatedAt||Date.now(),data:JSON.stringify(strip(c))});
      else if(APP.tombs[id])await SYNC.col.doc(id).set({updatedAt:APP.tombs[id],deleted:true});
      setSync("ok");
    }catch(e){SYNC.pending.add(id);setSync("error");if(e&&e.code==="unavailable")setTimeout(flush,4000+Math.random()*2000)}
  }
}
function applyRemote(snap){
  let changed=false;const remote=new Set();
  const liveRemote=snap.docs.filter(d=>d.exists&&!d.data().deleted).length;
  if(SYNC.first&&liveRemote){
    // un exemple jamais modifié sur ce nouvel appareil s'efface devant les vrais personnages du compte
    for(const id of Object.keys(APP.chars)){const c=APP.chars[id];if(c.isExample&&!snap.docs.some(d=>d.id===id)){delete APP.chars[id];delete lastHash[id];changed=true}}
  }
  for(const d of snap.docs){
    if(!d.exists)continue;const r=d.data(),id=d.id;remote.add(id);
    const loc=APP.chars[id];
    if(r.deleted){
      if(loc&&(loc.updatedAt||0)<=r.updatedAt){delete APP.chars[id];delete lastHash[id];changed=true}
      APP.tombs[id]=Math.max(APP.tombs[id]||0,r.updatedAt);continue;
    }
    if(APP.tombs[id]&&APP.tombs[id]>=r.updatedAt){SYNC.pending.add(id);continue}
    if(!loc||(loc.updatedAt||0)<r.updatedAt){
      let data;try{data=JSON.parse(r.data)}catch(e){continue}
      const keep=loc?{ui:loc.ui,mode:loc.mode}:{};
      const c=migrate(Object.assign(data,keep,{id,updatedAt:r.updatedAt}));
      APP.chars[id]=c;lastHash[id]=hashOf(c);changed=true;
    }else if((loc.updatedAt||0)>r.updatedAt)SYNC.pending.add(id);
  }
  if(SYNC.first){
    for(const id in APP.chars)if(!remote.has(id))SYNC.pending.add(id);
    for(const id in APP.tombs)if(!remote.has(id))SYNC.pending.add(id);
    SYNC.first=false;
  }
  if(!Object.keys(APP.chars).length){const c=blankChar();APP.chars[c.id]=c;lastHash[c.id]=hashOf(c);SYNC.pending.add(c.id)}
  if(!APP.chars[APP.cur])APP.cur=Object.keys(APP.chars)[0];
  S=APP.chars[APP.cur];
  persist();setSync("ok");
  if(SYNC.pending.size)flush();
  if(changed)safeRender();
}
function safeRender(){
  const a=document.activeElement;
  if(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="checkbox"))){SYNC.deferred=true;return}
  render();
}
document.addEventListener("focusout",()=>{if(SYNC.deferred){SYNC.deferred=false;setTimeout(render,0)}});
(async()=>{
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    setSync("sync");
    SYNC.col=db.collection("data/users/"+id);
    SYNC.col.onSnapshot(applyRemote,()=>setSync("error"));
  }catch(e){setSync("error")}
})();

let EXPORT_TEXT="";
function slug(s){return (s||"personnage").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"personnage"}
async function doExport(all){
  const list=all?Object.values(APP.chars):[S];
  const data=JSON.stringify({app:"compagnon-dnd",version:2,exportedAt:new Date().toISOString(),chars:list.map(c=>Object.assign(strip(c),{id:c.id}))},null,2);
  const fn=(all?"personnages-dnd":slug(S.name))+".json";
  let dl=null;try{dl=window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads"):null}catch(e){}
  if(dl){
    try{await dl.save({filename:fn,data});toast("Export","✓",`${fn} · ${list.length} personnage${list.length>1?"s":""}`,"");EXPORT_TEXT="";render();return}
    catch(e){if(e&&e.code==="declined")return}
  }
  if(!window.claude){
    try{const u=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Export","✓",fn,"");return}catch(e){}
  }
  EXPORT_TEXT=data;render();
  setTimeout(()=>{const t=document.getElementById("expText");if(t)t.scrollIntoView({block:"center"})},50);
}
function importText(txt){
  let obj;try{obj=JSON.parse(txt)}catch(e){toast("Import","✕","Ce texte n'est pas un export valide (JSON illisible).","fail");return}
  const list=Array.isArray(obj.chars)?obj.chars:(obj&&obj.abil?[obj]:[]);
  const ok=list.filter(c=>c&&typeof c==="object"&&c.abil&&typeof c.abil==="object");
  if(!ok.length){toast("Import","✕","Aucun personnage trouvé dans ce fichier.","fail");return}
  let first=null;
  for(const raw of ok){
    const c=JSON.parse(JSON.stringify(raw));
    if(!c.id||APP.chars[c.id]||APP.tombs[c.id])c.id=uid();
    migrate(c);c.updatedAt=Date.now();c.isExample=false;
    APP.chars[c.id]=c;lastHash[c.id]=hashOf(c);queuePush(c.id);first=first||c.id;
  }
  APP.cur=first;S=APP.chars[first];persist();
  toast("Import","✓",`${ok.length} personnage${ok.length>1?"s importés":" importé"}`,"");
}


const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mod=k=>Math.floor((S.abil[k]-10)/2);
const sg=n=>(n>=0?"+":"−")+Math.abs(n);
const prof=()=>2+Math.floor((Math.max(1,S.level)-1)/4);
function d(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%n)}

let tt;
function toast(label,total,detail,kind){
  const el=document.getElementById("toast");
  el.className="toast show "+(kind||"");
  el.innerHTML=`<div class="tot">${esc(total)}</div><div class="txt"><b>${esc(label)}</b><small>${esc(detail)}</small></div>`;
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),4200);
}
function logIt(label,total,detail,kind){S.log.unshift({label,total,detail,kind});S.log=S.log.slice(0,30)}
function d20(label,m,extra){
  const mode=S.mode, a=d(20);let b=null,k=a;
  if(mode!=="norm"){b=d(20);k=mode==="adv"?Math.max(a,b):Math.min(a,b)}
  const total=k+m, kind=k===20?"crit":k===1?"fail":"";
  let det=(b===null?`d20 : ${a}`:`d20 : ${a} et ${b} (${mode==="adv"?"avantage":"désavantage"})`)+(m?` ${sg(m)}`:"");
  if(kind==="crit")det+=" · 20 naturel, coup critique !"; if(kind==="fail")det+=" · 1 naturel, échec";
  if(extra)det+=" · "+extra;
  toast(label,total,det,kind);logIt(label,total,det,kind);
  S.mode="norm";
  return k;
}

const abbr=k=>ABIL.find(a=>a[0]===k)[1];
const full=k=>ABIL.find(a=>a[0]===k)[2];
function atkAbil(a){if(a.abil==="fin")return mod("for")>=mod("dex")?"for":"dex";return a.abil||"for"}
const spellAtk=()=>mod(S.castAbil)+prof();
const spellDD=()=>8+mod(S.castAbil)+prof();
const cantripMult=()=>1+(S.level>=5)+(S.level>=11)+(S.level>=17);
function parseDice(s){
  const dice={};let flat=0;
  String(s||"").replace(/\s/g,"").replace(/(\d*)d(\d+)|([+-]?\d+)(?![\dd])/gi,(m,n,f,c)=>{if(f){dice[f]=(dice[f]||0)+(+n||1)}else if(c)flat+= +c;return""});
  return{dice,flat};
}
function slotOf(a){return Math.max(a.l,+(S.ui.slot[a.id]||a.l))}
function dmgSpec(a){
  const two=a.kind==="arme"&&a.vers&&S.ui.two[a.id];
  const p=parseDice(two?a.vers:a.dmg);
  if(a.kind==="sort"){
    if(a.l===0){for(const f in p.dice)p.dice[f]*=cantripMult()}
    else if(a.up){const u=parseDice(a.up),extra=slotOf(a)-a.l;for(const f in u.dice)p.dice[f]=(p.dice[f]||0)+u.dice[f]*extra;p.flat+=u.flat*extra}
  }
  let m=p.flat;
  if(a.kind==="arme")m+=mod(atkAbil(a))+(+a.bonus||0);
  else if(a.addMod)m+=mod(S.castAbil);
  return{dice:p.dice,m};
}
function fmtDice(sp,crit){
  const f=Object.keys(sp.dice).sort((x,y)=>y-x).map(k=>`${sp.dice[k]*(crit?2:1)}d${k}`).join("+")||"0";
  return f+(sp.m?(sp.m>0?"+":"−")+Math.abs(sp.m):"");
}
function atkBonus(a){return a.kind==="arme"?mod(atkAbil(a))+(a.prof?prof():0)+(+a.bonus||0):spellAtk()}
function masteryText(a){return(MASTERY[a.mastery]||"").replace("{dd}",8+mod(atkAbil(a))+prof())}
function rollDmg(a,crit,prefix){
  const sp=dmgSpec(a),parts=[];let sum=0;
  for(const f of Object.keys(sp.dice).sort((x,y)=>y-x)){const n=sp.dice[f]*(crit?2:1);const r=[];for(let i=0;i<n;i++)r.push(d(+f));sum+=r.reduce((x,y)=>x+y,0);parts.push(`${n}d${f} [${r.join(", ")}]`)}
  const total=Math.max(0,sum+sp.m), heal=a.mode==="heal";
  const label=`${a.n} · ${heal?"soins":crit?"dégâts critiques":"dégâts"}`;
  prefix=(prefix||"").replace(/^ · /,"");
  let det=(prefix?prefix+" · ":"")+parts.join(" + ")+(sp.m?` ${sg(sp.m)}`:"")+(a.type&&!heal?` ${a.type}`:"");
  if(a.kind==="sort"&&a.mode==="save"&&a.half)det+=` · moitié (${Math.floor(total/2)}) si réussite`;
  toast(label,heal?"+"+total:total,det,crit?"crit":"");logIt(label,heal?"+"+total:total,det,crit?"crit":"");
}
function spendSlot(L){
  if(S.used[L-1]>=S.slots[L-1])return null;
  S.used[L-1]++;const r=S.slots[L-1]-S.used[L-1];
  return`emplacement niv. ${L} dépensé, ${r} restant${r>1?"s":""}`;
}
function rollDice(n,f,m,label){
  const r=[];for(let i=0;i<n;i++)r.push(d(f));
  const total=r.reduce((a,b)=>a+b,0)+m;
  let kind="";if(n===1&&f===20)kind=r[0]===20?"crit":r[0]===1?"fail":"";
  const det=`${n}d${f}${m?" "+sg(m):""} : [${r.join(", ")}]`;
  toast(label||`${n}d${f}${m?sg(m):""}`,total,det,kind);logIt(label||`${n}d${f}${m?sg(m):""}`,total,det,kind);
}

function selField(id,field,opts,cur,other,label,ph){

}

function perso(){

  </section>

  <button class="btn bad" data-act="reset">${S.resetArm?"Confirmer : remplacer ce perso par l'exemple":"Remplacer ce perso par l'exemple"}</button>`;

const MASTERY_CLS=["Barbare","Guerrier","Paladin","Rôdeur","Roublard"];
function weaponProf(w){
  if(w.g<2)return true;
  if(["Barbare","Guerrier","Paladin","Rôdeur"].includes(S.cls))return true;
  if(S.cls==="Moine"&&w.props.includes("Légère"))return true;
  if(S.cls==="Roublard"&&(w.props.includes("Finesse")||w.props.includes("Légère")))return true;
  return false;
}
function weaponFields(w){return{n:w.n,dmg:w.dmg,vers:w.vers,type:w.type,range:w.range,mastery:w.mastery,props:w.props.slice(),
  abil:w.g===1||w.g===3?(w.props.includes("Finesse")?"fin":"dex"):(w.props.includes("Finesse")?"fin":"for")}}
function toAtk(w){return Object.assign({id:uid(),kind:"arme",cat:w.n,prof:weaponProf(w),bonus:0,masteryOn:MASTERY_CLS.includes(S.cls),note:""},weaponFields(w))}

const CASTER={Barde:"full",Clerc:"full",Druide:"full",Ensorceleur:"full",Magicien:"full",Paladin:"half",Rôdeur:"half",Occultiste:"pact"};
const FULL=[[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
const HALF=[[2],[2],[3],[3],[4,2],[4,2],[4,3],[4,3],[4,3,2],[4,3,2],[4,3,3],[4,3,3],[4,3,3,1],[4,3,3,1],[4,3,3,2],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2]];
function slotTable(cls,L){
  const t=CASTER[cls];if(!t)return null;
  let row;
  if(t==="full")row=FULL[L-1];else if(t==="half")row=HALF[L-1];
  else{const n=L===1?1:L<=10?2:L<=16?3:4,lv=L<=2?1:L<=4?2:L<=6?3:L<=8?4:5;row=[];row[lv-1]=n}
  return Array.from({length:9},(_,i)=>row[i]||0);
}
const slotTxt=a=>a.map((n,i)=>n?`niv. ${i+1} ×${n}`:"").filter(Boolean).join(", ")||"aucun";

const STD=[15,14,13,12,10,8], COST={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
const BG_ABIL={Acolyte:["int","sag","cha"],Artisan:["for","dex","int"],Artiste:["for","dex","cha"],Charlatan:["dex","con","cha"],Criminel:["dex","con","int"],Ermite:["con","sag","cha"],Fermier:["for","con","sag"],Garde:["for","int","sag"],Guide:["dex","con","sag"],Marchand:["con","int","cha"],Marin:["for","dex","sag"],Noble:["for","int","cha"],Sage:["con","int","sag"],Scribe:["dex","int","sag"],Soldat:["for","dex","con"],Voyageur:["dex","sag","cha"]};
const PRIO={Barbare:"for con dex sag cha int",Barde:"cha dex con sag int for",Clerc:"sag con for dex cha int",Druide:"sag con dex int cha for",Ensorceleur:"cha con dex sag int for",Guerrier:"for con dex sag int cha",Magicien:"int con dex sag cha for",Moine:"dex sag con for int cha",Occultiste:"cha con dex sag int for",Paladin:"for cha con sag dex int",Rôdeur:"dex sag con for int cha",Roublard:"dex con int sag cha for"};
const prioOf=()=>(PRIO[S.cls]||"for dex con int sag cha").split(" ");
function genDefault(){
  const g={m:"std",pool:STD.slice(),asg:{},pts:{for:8,dex:8,con:8,int:8,sag:8,cha:8},bm:"21",b2:"",b1:"",b3:""};
  suggest(g);return g;
}
function suggest(g){
  const pr=prioOf(),order=g.pool.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  pr.forEach((k,i)=>g.asg[k]=order[i]);
  if(g.m==="pts"){const p={};pr.forEach((k,i)=>p[k]=[15,14,13,12,10,8][i]);
    const cost=Object.values(p).reduce((s,v)=>s+COST[v],0);if(cost<=27)g.pts=p}
  const opts=BG_ABIL[S.bg]||pr.slice(0,3);
  const sorted=opts.slice().sort((a,b)=>pr.indexOf(a)-pr.indexOf(b));
  g.b2=sorted[0];g.b1=sorted[1];g.b3=sorted[2];
}
function genBase(g){
  if(g.m==="pts")return Object.assign({},g.pts);
  const o={};ABIL.forEach(([k])=>o[k]=g.pool[g.asg[k]]??8);return o;
}
function genBonus(g){
  const b={for:0,dex:0,con:0,int:0,sag:0,cha:0};
  if(g.bm==="21"){if(g.b2)b[g.b2]+=2;if(g.b1&&g.b1!==g.b2)b[g.b1]+=1}
  else[g.b2,g.b1,g.b3].forEach(k=>{if(k)b[k]=1});
  return b;
}
function genIssues(g){
  const out=[];
  if(g.m!=="pts"){const used=ABIL.map(([k])=>g.asg[k]);if(new Set(used).size<6)out.push("Chaque valeur ne peut servir qu'une fois.")}
  else{const c=ABIL.reduce((s,[k])=>s+COST[g.pts[k]],0);if(c>27)out.push(`Trop de points dépensés (${c}/27).`)}
  if(g.bm==="21"&&g.b2===g.b1)out.push("Le +2 et le +1 doivent aller à deux caractéristiques différentes.");
  if(g.bm==="111"&&new Set([g.b2,g.b1,g.b3]).size<3)out.push("Les trois +1 vont à trois caractéristiques différentes.");
  return out;
}

  insp:()=>{S.insp=!S.insp},

    if(r===20){S.hp=1;S.death={s:0,f:0};det="20 naturel : tu reprends conscience avec 1 PV"}
    else if(r===1){S.death.f=Math.min(3,S.death.f+2);det="1 naturel : deux échecs"}
    else if(r>=10){S.death.s=Math.min(3,S.death.s+1);det=S.death.s>=3?"Trois réussites : tu es stabilisé":"Réussite"}

  short:()=>{if(S.hdUsed>=S.level)return;const r=d(S.hitDie),c=mod("con"),g=Math.max(1,r+c),was=S.hp;S.hdUsed++;S.hp=Math.min(S.hpMax,S.hp+g);
    toast("Repos court",`+${S.hp-was}`,`d${S.hitDie} : ${r} ${sg(c)} · ${S.level-S.hdUsed} dé(s) de vie restant(s)`,"")},

  die:f=>{const dc=S.dc||{n:1,m:0};f=+f;if(f===20&&dc.n===1){d20("d20"+(dc.m?sg(dc.m):""),dc.m)}else rollDice(dc.n,f,dc.m)},
  dn:v=>{S.dc=S.dc||{n:1,m:0};S.dc.n=Math.max(1,Math.min(20,S.dc.n+ +v))},
  dm:v=>{S.dc=S.dc||{n:1,m:0};S.dc.m=Math.max(-10,Math.min(20,S.dc.m+ +v))},
  clearlog:()=>{S.log=[]},
  gem:v=>{const[i,j]=v.split(":").map(Number);S.used[i]=j<S.used[i]?j:j+1},
  prep:i=>{S.spells[+i].p=!S.spells[+i].p},
  spf:v=>{S.ui.spf=v},
  spDmg:i=>{const a=S.spells[+i],c=S.crit===a.id;rollDmg(a,c);if(c)S.crit=null},
  spCast:i=>{const a=S.spells[+i];let slotTxt="";
    if(a.l>0){const L=slotOf(a);slotTxt=spendSlot(L);if(!slotTxt){toast(a.n,"✕",`Plus d'emplacement de niveau ${L}. Choisis-en un autre ou fais un repos long.`,"fail");return}}
    const conc=a.conc?" · concentration":"";
    if(a.mode==="atk"&&a.dmg!==undefined){const k=d20(`${a.n} · attaque de sort`,spellAtk(),(slotTxt||"")+conc);S.crit=k===20?a.id:(S.crit===a.id?null:S.crit)}
    else if(a.mode==="save"&&a.dmg)rollDmg(a,false,`DD ${spellDD()} JS ${full(a.save)}${slotTxt?" · "+slotTxt:""}${conc}`);
    else if(a.mode==="save"){toast(a.n,"DD "+spellDD(),`JS ${full(a.save)}${slotTxt?" · "+slotTxt:""}${conc}`,"");logIt(a.n,"DD "+spellDD(),`JS ${full(a.save)}`,"")}
    else if((a.mode==="heal"||a.mode==="dmg")&&a.dmg)rollDmg(a,false,(slotTxt||"")+conc);
    else{const t=(slotTxt||(a.l?"":"Sort mineur lancé"))+conc;toast(a.n,"✦",t.replace(/^ · /,""),"");logIt(a.n,"✦",t.replace(/^ · /,""),"")}},
  spAdd:()=>{const id=uid();S.spells.push(sp({id,n:"Nouveau sort",l:1}));S.ui.open[id]=true;S.ui["ed-"+id]=true;S.ui.spf="all";S.ui.pick=null;S.isExample=false},
  spDel:i=>{const a=S.spells[+i];if(S.delArm!==a.id){S.delArm=a.id;return}S.spells.splice(+i,1);S.delArm=null},
  qty:v=>{const[i,s]=v.split(":").map(Number);S.items[i].q=Math.max(0,S.items[i].q+s)},
  delitem:i=>{S.items.splice(+i,1)},
  additem:()=>{const n=document.getElementById("newItem").value.trim();if(!n)return;S.items.push({n,q:1,note:document.getElementById("newNote").value.trim()})},
  reset:()=>{if(!S.resetArm){S.resetArm=true;return}const id=S.id,c=migrate(example());c.id=id;APP.chars[id]=c;S=c},
  pick:id=>{if(!APP.chars[id])return;APP.cur=id;S=APP.chars[id];persist()},
  newChar:()=>{const c=blankChar();APP.chars[c.id]=c;lastHash[c.id]="";APP.cur=c.id;S=c},
  dupChar:()=>{const c=migrate(JSON.parse(JSON.stringify(S)));c.id=uid();c.name=(S.name||"Personnage")+" (copie)";c.isExample=false;APP.chars[c.id]=c;lastHash[c.id]="";APP.cur=c.id;S=c},
  delChar:()=>{if(S.delArm!=="char"){S.delArm="char";return}const id=S.id;delete APP.chars[id];delete lastHash[id];APP.tombs[id]=Date.now();queuePush(id);
    if(!Object.keys(APP.chars).length){const c=blankChar();APP.chars[c.id]=c;lastHash[c.id]=""}
    APP.cur=Object.keys(APP.chars)[0];S=APP.chars[APP.cur];toast("Personnage supprimé","✓","Supprimé de tous tes appareils synchronisés","")},
  addBg:()=>{const el=document.getElementById("newBg"),n=el&&el.value.trim();if(!n)return;if(!BACKGROUNDS.includes(n)&&!APP.customBg.includes(n))APP.customBg.push(n);S.bg=n;S.isExample=false},
  exp:v=>{doExport(v==="all")},
  pickOpen:k=>{S.ui.pick=k;S.ui.q="";if(k==="sort"){S.ui.pc=CLASS_LETTER[S.cls]||"";S.ui.pl=""}},
  pickClose:()=>{S.ui.pick=null},
  pickAdd:v=>{const[k,i]=v.split(":");
    if(k==="arme"){const a=toAtk(WEAPONS[+i]);S.atk.push(a);toast(a.n,"✓",`Ajoutée à tes armes${a.prof?"":" (non maîtrisée par ta classe)"}`,"")}
    else{const c=SPELLS[+i];if(S.spells.some(x=>x.cat===c.n||x.n===c.n))return;S.spells.push(toSpell(c));toast(c.n,"✓","Ajouté au grimoire","")}
    S.isExample=false},
  catReset:v=>{const[k,i]=v.split(":"),e=S[k][+i];if(S.delArm!=="cat"+e.id){S.delArm="cat"+e.id;return}
    Object.assign(e,JSON.parse(JSON.stringify(catalogOf(e))));S.delArm=null;toast(e.n,"✓","Version du catalogue rétablie","")},
  luOpen:()=>{const nt=isAsi(S.level+1);const pr=prioOf();S.ui.lu={hp:"avg",roll:null,asi:"p2",a1:pr.find(k=>S.abil[k]<20)||pr[0],a2:pr.filter(k=>S.abil[k]<20)[1]||pr[1],feat:"",slots:true};S.ui.gen=null},
  luClose:()=>{S.ui.lu=null},
  luHp:v=>{S.ui.lu.hp=v},
  luRoll:()=>{S.ui.lu.roll=d(S.hitDie)},
  luAsi:v=>{S.ui.lu.asi=v},
  luApply:()=>{const lu=S.ui.lu,N=S.level+1,gain=luGain();if(gain===null)return;
    S.lvlHist=(S.lvlHist||[]).slice(-4);
    S.lvlHist.push({level:S.level,hpMax:S.hpMax,hp:S.hp,abil:Object.assign({},S.abil),slots:S.slots.slice(),used:S.used.slice(),feats:(S.feats||[]).slice()});
    const conBefore=mod("con");
    S.level=N;S.hpMax+=gain;S.hp+=gain;S.feats=S.feats||[];
    let txt=`+${gain} PV`;
    if(isAsi(N)){const cap=N===19?30:20;
      if(lu.asi==="feat"){S.feats.push({lvl:N,n:lu.feat.trim()});txt+=` · don ${lu.feat.trim()}`}
      else{const up=lu.asi==="p2"?[[lu.a1,2]]:[[lu.a1,1],[lu.a2,1]];up.forEach(([k,v])=>S.abil[k]=Math.min(cap,S.abil[k]+v));
        S.feats.push({lvl:N,n:N===19?"Faveur épique":"Amélioration de caractéristiques"});txt+=" · "+up.map(([k,v])=>`${abbr(k)} +${v}`).join(", ")}
      const dc=mod("con")-conBefore;if(dc>0){S.hpMax+=dc*N;S.hp+=dc*N;txt+=` · +${dc*N} PV (Constitution)`}}
    const nt=slotTable(S.cls,N);if(nt&&lu.slots!==false){S.slots=nt;S.used=S.used.map((u,i)=>Math.min(u,nt[i]))}
    S.ui.lu=null;S.isExample=false;toast(`Niveau ${N} !`,"↑",txt,"crit")},
  luUndo:()=>{const h=(S.lvlHist||[]).pop();if(!h)return;Object.assign(S,{level:h.level,hpMax:h.hpMax,hp:Math.min(S.hp,h.hpMax),abil:h.abil,slots:h.slots,used:h.used,feats:h.feats});S.ui.lu=null;toast("Niveau annulé","↓",`Retour au niveau ${h.level}`,"")},
  featDel:i=>{S.feats.splice(+i,1)},
  genOpen:()=>{S.ui.gen=genDefault();S.ui.edit=true},
  genClose:()=>{S.ui.gen=null},
  genM:v=>{const g=S.ui.gen;g.m=v;if(v==="std")g.pool=STD.slice();if(v==="roll"){A.genRoll();return}suggest(g)},
  genRoll:()=>{const g=S.ui.gen;g.m="roll";g.pool=Array.from({length:6},()=>{const r=[d(6),d(6),d(6),d(6)].sort((a,b)=>b-a);return r[0]+r[1]+r[2]}).sort((a,b)=>b-a);suggest(g)},
  genPt:v=>{const[k,s]=v.split(":"),g=S.ui.gen;g.pts[k]=Math.max(8,Math.min(15,g.pts[k]+ +s))},
  genBm:v=>{S.ui.gen.bm=v},
  genSuggest:()=>{suggest(S.ui.gen)},
  genApply:()=>{const g=S.ui.gen;if(genIssues(g).length)return;const b=genBase(g),bo=genBonus(g);ABIL.forEach(([k])=>S.abil[k]=Math.min(20,b[k]+bo[k]));
    if(S.level===1){S.hpMax=Math.max(1,S.hitDie+mod("con"));S.hp=S.hpMax}
    S.ui.gen=null;S.isExample=false;toast("Caractéristiques appliquées","✓",ABIL.map(([k,a])=>`${a} ${S.abil[k]}`).join(" · "),"")},
  impPaste:()=>{const t=document.getElementById("impText");if(t&&t.value.trim())importText(t.value)},
  copyExp:()=>{const t=document.getElementById("expText");if(!t)return;
    const sel=()=>{t.focus();t.select()};
    try{navigator.clipboard.writeText(EXPORT_TEXT).then(()=>toast("Copié","✓","Colle-le sur l'autre appareil","")).catch(()=>{sel();toast("Copie","…","Texte sélectionné : copie-le avec le menu du téléphone","")})}catch(e){sel()}},
  atkOpen:id=>{S.ui.open[id]=!S.ui.open[id]},
  two:id=>{S.ui.two[id]=!S.ui.two[id]},
  critT:id=>{S.crit=S.crit===id?null:id},
  atkRoll:i=>{const a=S.atk[+i];
    const extra=a.mastery&&a.masteryOn?`Botte ${a.mastery} si touché`:"";
    const k=d20(`${a.n} · attaque`,atkBonus(a),extra);
    S.crit=k===20?a.id:(S.crit===a.id?null:S.crit)},
  dmgRoll:i=>{const a=S.atk[+i],c=S.crit===a.id;rollDmg(a,c);if(c)S.crit=null},
  addAtk:()=>{const id=uid();
    S.atk.push({id,kind:"arme",n:"Nouvelle arme",abil:"for",prof:true,bonus:0,dmg:"1d8",vers:"",type:"tranchants",range:"Corps à corps",mastery:"",masteryOn:false,props:[],note:""});
    S.ui.open[id]=true;S.ui["ed-"+id]=true;S.ui.pick=null;S.isExample=false},
  delAtk:i=>{const a=S.atk[+i];if(S.delArm!==a.id){S.delArm=a.id;return}S.atk.splice(+i,1);S.delArm=null}
};

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t||t.disabled)return;
  const act=t.dataset.act;
  if(act!=="reset")S.resetArm=false;
  if(!["delAtk","spDel","delChar","catReset"].includes(act))S.delArm=null;
  A[act](t.dataset.v);render();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="impFile"){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{importText(String(r.result));t.value="";render()};r.readAsText(f);return}
  if(t.dataset.other){
    const f=t.dataset.other;
    if(t.value==="__other"){S.ui["oth_"+f]=true;S[f]="";if(f==="cls")S.subcls="";render();return}
    S.ui["oth_"+f]=false;
  }
  if(t.dataset.bind==="cls"&&CLASSES[t.value]){const k=CLASSES[t.value];S.hitDie=k.hd;S.castAbil=k.ca;if(!k.sub.includes(S.subcls))S.subcls="";S.ui.oth_subcls=false}
  if(t.dataset.bind){
    const path=t.dataset.bind.split(".");let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];
    const isNum=(t.type==="number"||t.tagName==="SELECT")&&!t.dataset.str;
    o[path.at(-1)]=t.type==="checkbox"?t.checked:isNum?(Number(t.value)||0):t.value;
    if(path[0]==="slots")S.used=S.used.map((u,i)=>Math.min(u,S.slots[i]));
    if(path[0]==="hpMax")S.hp=Math.min(S.hp,S.hpMax);
    if(path[0]==="level")S.level=Math.max(1,Math.min(20,S.level)),S.hdUsed=Math.min(S.hdUsed,S.level);
    if(!["temp","coins","ui"].includes(path[0]))S.isExample=false;
    render();
  }else if(t.dataset.tog){
    const path=t.dataset.tog.split(".");let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];
    const k=path.at(-1),arr=o[k]||[];o[k]=t.checked?[...new Set([...arr,t.value])]:arr.filter(x=>x!==t.value);S.isExample=false;render();
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="pickQ"){S.ui.q=t.value;const l=document.getElementById("pickList");if(l)l.innerHTML=pickList(S.ui.pick);return}if(t.tagName!=="TEXTAREA"||!t.dataset.bind)return;
  const path=t.dataset.bind.split(".");let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];
  o[path.at(-1)]=t.value;save();grow(t);
});
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+2+"px"}
document.addEventListener("toggle",e=>{const u=e.target.dataset&&e.target.dataset.ui;if(u){S.ui[u]=e.target.open;save()}},true);
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;const id=e.target.id;
  if(id==="newSpell")A.addspell(),render();
  if(id==="newItem"||id==="newNote")A.additem(),render();
  if(id==="hpAmt"){}
});
document.getElementById("toast").addEventListener("click",e=>e.currentTarget.classList.remove("show"));
safeRender();
</script>

</body>
</html>
